name: CI build dotnet app
on:
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: Setup dotnet
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '10.0.x'
            - name: dotnet restore dependencies
              run: dotnet restore
            - name: build application
              run: dotnet build --no-restore